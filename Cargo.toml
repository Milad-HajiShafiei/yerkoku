[package]
name = "yerkoku"
version = "0.1.0"
edition = "2024"
description = "Blueprint-driven TUI for generating development prompts"
authors = ["Milad Hajishafiei"]
license = "MIT"

[dependencies]
ratatui = { version = "0.30.2", features = ["all-widgets", "macros"] }
crossterm = "0.29.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
clap = { version = "4.6.6", features = ["derive"] }
anyhow = "1.0.104"
strum = { version = "0.28.0", features = ["derive"] }
chrono = { version = "0.4.45", features = ["serde"] }
reqwest = { version = "0.12", features = ["blocking", "json"] }
unicode-width = "0.2"
arboard = "3.6.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
